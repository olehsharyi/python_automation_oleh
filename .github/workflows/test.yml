name: Playwright Tests & Linters

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Choose test suite"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression
          - slow
          - all

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install --with-deps

      - name: Create .env file
        run: |
          echo "APP_USERNAME=${{ secrets.APP_USERNAME }}" >> .env
          echo "APP_PASSWORD=${{ secrets.APP_PASSWORD }}" >> .env

      - name: Run selected Pytest suite
        run: |
          if [ "${{ inputs.test_suite }}" = "smoke" ]; then
            pytest -m smoke -n auto --alluredir=allure-results
          elif [ "${{ inputs.test_suite }}" = "regression" ]; then
            pytest -m regression -n auto --alluredir=allure-results
          elif [ "${{ inputs.test_suite }}" = "slow" ]; then
            pytest -m slow -n auto --alluredir=allure-results
          else
            pytest -n auto --alluredir=allure-results
          fi

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          commit_message: "Deploy Allure report for ${{ github.sha }}"

  notify:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_STATUS: ${{ needs.test.result }}
          LINT_STATUS: ${{ needs.lint.result }}
        run: |
          if [ "$LINT_STATUS" = "failure" ]; then
            EMOJI="⚠️"
            MESSAGE="Ruff linting failed"
          elif [ "$TEST_STATUS" = "success" ]; then
            EMOJI="✅"
            MESSAGE="Automation tests passed"
          else
            EMOJI="❌"
            MESSAGE="Automation tests failed"
          fi

          curl -H "Content-Type: application/json" \
            -d "{
              \"content\": \"$EMOJI $MESSAGE\n\nSuite: ${{ inputs.test_suite }}\n📊 Allure Report: https://olehsharyi.github.io/python_automation_oleh/\n🔗 GitHub Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }" \
            "$DISCORD_WEBHOOK"
