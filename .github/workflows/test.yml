name: Playwright Tests

# Вказуємо, коли запускати workflow
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest # Запускаємо на свіжому Linux-сервері від GitHub

    steps:
    # 1. Завантажуємо код репозиторію у віртуальну машину
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Налаштовуємо Python версії 3.10
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Кешуємо залежності для швидшого завантаження

    # 3. Встановлюємо залежності з requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Встановлюємо браузери Playwright та їх системні ліби для Linux
    - name: Install Playwright Browsers
      run: playwright install --with-deps

    # 5. Запускаємо наші тести паралельно через pytest-xdist
    - name: Run Pytest tests
      env:
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
      run: |
        pytest -n auto --alluredir=allure-results